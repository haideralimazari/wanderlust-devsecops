name: DevSecOps pipeline

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  ci_secret_scan:
    name: ci / Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci_lint:
    name: ci / Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint || true 

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Backend lint
        working-directory: backend
        run: npx eslint . --ext .js --max-warnings 0 || true 

  build_package:
    name: build / Build & Package
    runs-on: ubuntu-latest
    needs: [ci_secret_scan, ci_lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and run tests (backend)
        working-directory: backend
        run: |
          npm ci
          npm test --silent || true

      - name: Build frontend (production)
        working-directory: frontend
        run: |
          npm ci
          npm run build || true

  build_container_scan:
    name: build / Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: build_package
    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  build_and_push:
    name: build / Build & Push Docker images
    runs-on: ubuntu-latest
    needs: build_container_scan
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image (sha)
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }}

      - name: Build & push frontend image (sha)
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:${{ github.sha }}

      - name: Push 'latest' tags (only on main)
        if: github.ref == 'refs/heads/main'
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }}
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:${{ github.sha }}
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:latest

      - name: Set image tag output
        id: set_tag
        run: echo "image_tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

  ci_sonar:
    name: ci / SonarQube
    runs-on: ubuntu-latest
    needs: build_package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Sonar token
        id: sonar-token-check
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "run_sonar=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_sonar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: SonarQube Scan
        if: steps.sonar-token-check.outputs.run_sonar == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.projectKey=wanderlust
            -Dsonar.projectName=Wanderlust
            -Dsonar.sources=backend,frontend
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/package-lock.json

  cd_deploy_ec2:
    name: CD - Deploy to EC2 via SSH
    runs-on: ubuntu-latest
    needs: [build_and_push]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify deploy secrets
        run: |
          if [ -z "${{ secrets.EC2_SSH_PRIVATE_KEY }}" ] || [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_USERNAME }}" ]; then
            echo "One or more EC2 deploy secrets are missing (EC2_SSH_PRIVATE_KEY, EC2_HOST, EC2_USERNAME)."
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Docker Hub secrets are missing (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN)."
            exit 1
          fi
          echo "Deploying to ${{ secrets.EC2_HOST }} as ${{ secrets.EC2_USERNAME }}"
          echo "Images: ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-{backend,frontend}:${{ needs.build_and_push.outputs.image_tag }}"

      - name: Setup SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy deploy files to EC2
        env:
          IMAGE_TAG: ${{ needs.build_and_push.outputs.image_tag }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          APP_DIR="/home/${{ secrets.EC2_USERNAME }}/wanderlust"
          ssh -i ~/.ssh/id_rsa -p "${{ secrets.EC2_PORT || '22' }}" "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" "mkdir -p '${APP_DIR}' '${APP_DIR}/backend' '${APP_DIR}/frontend' '${APP_DIR}/nginx' '${APP_DIR}/backend/data'"
          printf 'DOCKERHUB_USER=%s\nIMAGE_TAG=%s\n' "$DOCKERHUB_USER" "$IMAGE_TAG" > .env.deploy
          scp -i ~/.ssh/id_rsa -P "${{ secrets.EC2_PORT || '22' }}" docker-compose.yml "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${APP_DIR}/"
          scp -i ~/.ssh/id_rsa -P "${{ secrets.EC2_PORT || '22' }}" .env.deploy "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${APP_DIR}/.env"
          scp -i ~/.ssh/id_rsa -P "${{ secrets.EC2_PORT || '22' }}" backend/.env.docker "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${APP_DIR}/backend/.env.docker"
          scp -i ~/.ssh/id_rsa -P "${{ secrets.EC2_PORT || '22' }}" frontend/.env.docker "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${APP_DIR}/frontend/.env.docker"
          scp -i ~/.ssh/id_rsa -P "${{ secrets.EC2_PORT || '22' }}" nginx/default.conf "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${APP_DIR}/nginx/default.conf"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        env:
          IMAGE_TAG: ${{ needs.build_and_push.outputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,EC2_USERNAME
          script: |
            set -euo pipefail
            cd /home/$EC2_USERNAME/wanderlust

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            printf 'DOCKERHUB_USER=%s\nIMAGE_TAG=%s\n' "$DOCKERHUB_USERNAME" "$IMAGE_TAG" > .env

            echo "=== Deploy config ==="
            cat .env
            echo "Backend image:  ${DOCKERHUB_USERNAME}/wanderlust-backend:${IMAGE_TAG}"
            echo "Frontend image: ${DOCKERHUB_USERNAME}/wanderlust-frontend:${IMAGE_TAG}"

            export COMPOSE_PROJECT_NAME=wanderlust

            docker compose --env-file .env -f docker-compose.yml down --remove-orphans || true
            for container in frontend backend nginx mongo redis; do
              docker rm -f "$container" 2>/dev/null || true
            done

            # Ubuntu EC2 images ship with host nginx on port 80 — stop it before Docker nginx starts
            for svc in nginx apache2 httpd; do
              sudo systemctl stop "$svc" 2>/dev/null || true
              sudo systemctl disable "$svc" 2>/dev/null || true
            done
            sudo pkill -9 nginx 2>/dev/null || true
            sudo pkill -9 apache2 2>/dev/null || true

            for port in 80 5000 5173; do
              docker ps -q --filter "publish=${port}" | xargs -r docker rm -f 2>/dev/null || true
              if command -v fuser >/dev/null 2>&1; then
                sudo fuser -k "${port}/tcp" 2>/dev/null || true
              fi
            done
            sleep 2

            if ss -tln | grep -q ':80 '; then
              echo "ERROR: Port 80 is still in use:"
              sudo ss -tlnp | grep ':80 ' || true
              exit 1
            fi

            docker compose --env-file .env -f docker-compose.yml pull backend frontend
            docker compose --env-file .env -f docker-compose.yml up -d --no-build --pull always --remove-orphans --force-recreate

            echo "=== Running containers ==="
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

            if docker ps --format '{{.Image}}' | grep -E 'youruser/wanderlust|/wanderlust-(backend|frontend):local'; then
              echo "ERROR: Placeholder images detected — check .env and Docker Hub credentials."
              exit 1
            fi

            sleep 5
            curl -fsS http://localhost/ >/dev/null
            curl -fsS http://localhost/api/posts >/dev/null
            echo "Deploy successful — app is responding on port 80."

  cd_owasp_zap:
    name: DAST - OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: cd_deploy_ec2

    steps:
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: "http://${{ secrets.EC2_HOST }}"
          artifact_name: zapreport
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: report_html.html
